# Graphic FMEA 知识库
# 本文件覆盖领域 = Graphic。读取方：odk-design skill 按 SKILL.md 的领域匹配规则读取对应文件。
# 分析对象由设计技能根据业务流程中实际导致触发条件的对象填写，不在此预设。

- 触发条件: 调用copybit, copybit出错
  故障模式: AAE模糊失败
  故障影响: 失败时若有逃生无影响，无逃生可能会有效果问题
  故障原因: 存在多方面的原因，需要结合日志分析
  严酷度: 普通
  恢复措施: 无需恢复
  关键日志: "copybit ok but too long" 或 "invalid parameter"
  大数据打点事件: DMD_AAE_COPYBIT_EXCEPTION

- 触发条件: AAE hal层出错
  故障模式: AAE任务执行失败
  故障影响: 影响模糊、copybit功能
  故障原因: 需要结合日志
  严酷度: 普通
  恢复措施: 无
  关键日志: 无
  大数据打点事件: DMD_AAE_HAL_EXCEPTION

- 触发条件: 调用aae hianimation模糊hianimation失败
  故障模式: aae模糊时失败
  故障影响: 失败时若有逃生无影响，无逃生可能会有效果问题
  故障原因: 存在多方面的原因，需要结合日志分析
  严酷度: 普通
  恢复措施: 无需恢复
  关键日志: "invalid param is error"
  大数据打点事件: DMD_AAE_HIANIMATION_EXCEPTION

- 触发条件: AAE超时
  故障模式: AAE上层下发配置错误
  故障影响: 影响模糊、copybit功能
  故障原因: 需要结合具体日志
  严酷度: 普通
  恢复措施: 无
  关键日志: "wdt isr"
  大数据打点事件: DMD_AAE_KERNEL_EXCEPTION

- 触发条件: 出现hebc fault错误时
  故障模式: 用户输入异常hebc buffer
  故障影响: 可能会有花图，不影响正常功能
  故障原因: hebc header里的数据有问题
  严酷度: 一般
  恢复措施: 无法恢复
  关键日志: "HEBC_FAULT"
  大数据打点事件: HEBC_FAULT

- 触发条件: 图形单帧耗时超50ms时上报
  故障模式: 单帧绘制超时
  故障影响: 用户体验轻微卡顿
  故障原因: 图形单帧耗时超50ms
  严酷度: 一般
  恢复措施: 无
  关键日志: trace打印 "RSJankStats::ReportSceneJankFrame reportTime"
  大数据打点事件: JANK_FRAME_RS

- 触发条件: 图形连续丢帧超过5帧时上报
  故障模式: 连续多帧渲染超时
  故障影响: 用户体验明显卡顿
  故障原因: 图形连续丢帧超过5帧
  严酷度: 一般
  恢复措施: 无
  关键日志: 无
  大数据打点事件: JANK_FRAME_SKIP

- 触发条件: 图形render线程绘制耗时超过5s时上报
  故障模式: 长时间渲染超时
  故障影响: 用户操作界面长时间不刷新，冻屏
  故障原因: 图形render线程绘制耗时超过5s
  严酷度: 一般
  恢复措施: 无
  关键日志: 无
  大数据打点事件: NO_DRAW

- 触发条件: 图形单帧模糊耗时超5ms时上报
  故障模式: 图形单帧模糊耗时
  故障影响: 用户体验轻微卡顿
  故障原因: 图形单帧模糊耗时超5ms
  严酷度: 一般
  恢复措施: 无
  关键日志: 无
  大数据打点事件: RS_NODE_BLUR

- 触发条件: 图形单帧纹理耗时超5ms时上报
  故障模式: 图形单帧纹理耗时
  故障影响: 用户体验轻微卡顿
  故障原因: 图形单帧纹理耗时超5ms
  严酷度: 一般
  恢复措施: 无
  关键日志: 无
  大数据打点事件: RS_NODE_TEXTURE

- 触发条件: 渲染线程连续6帧超时
  故障模式: 渲染线程绘制超时
  故障影响: RS卡死
  故障原因: 渲染线程连续多帧渲染超时, 每帧超时2.5s
  严酷度: 严重
  恢复措施: 无
  关键日志: "Render Six consecutive frames are too long."
  大数据打点事件: RS_RENDER_EXCEPTION

- 触发条件: 5分钟内连续3次GPU重启
  故障模式: GPU多次重启
  故障影响: RS卡死
  故障原因: GPU异常
  严酷度: 严重
  恢复措施: 无
  关键日志: "FocusLeashWindowName"
  大数据打点事件: RS_VULKAN_ERROR